services:
  # =========================
  # Your API / App
  # =========================
  app:
    build: .
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.method=wrr"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

  # =========================
  # Traefik reverse proxy
  # =========================
  traefik:
    image: traefik:v2.14
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:8000"
      - "--api.dashboard=true"
    ports:
      - "8000:8000"   # External traffic entrypoint
      - "8080:8080"   # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - app-network
    labels:
      # Secure dashboard with basic auth
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.entrypoints=web"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USER}:${TRAEFIK_PASSWORD_HASH}"

  # =========================
  # Postgres - internal only
  # =========================
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # =========================
  # Redis - internal only
  # =========================
  redis:
    image: redis:7-alpine
    networks:
      - app-network

  # =========================
  # Prometheus - Traefik-managed
  # =========================
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # =========================
  # Grafana - Traefik-managed
  # =========================
  grafana:
    image: grafana/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

# =========================
# Volumes
# =========================
volumes:
  postgres_data:

# =========================
# Networks
# =========================
networks:
  app-network:
    driver: bridge
