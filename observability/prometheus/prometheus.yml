global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "server"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "observability-server-1:8000"
          - "observability-server-2:8000"
          - "observability-server-3:8000"
          - "observability-server-4:8000"
          - "observability-server-5:8000"

  # - job_name: "otel-collector"
  #   static_configs:
  #     - targets: ["opentelemetry-collector:8888"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
